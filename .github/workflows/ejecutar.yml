name: Ejecutar EA1

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ejecutar-ea1-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Crear entorno virtual
        run: python -m venv .venv

      - name: Instalar dependencias
        run: |
          source .venv/bin/activate
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pyarrow openpyxl

      - name: Limpiar datos y reportes generados
        run: |
          mkdir -p src/notebook/data src/notebook/reportes
          find src/notebook/data -mindepth 1 -delete
          find src/notebook/reportes -mindepth 1 -delete

      - name: Ejecutar notebook_1.ipynb
        working-directory: src/notebook
        run: |
          source ../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            notebook_1.ipynb

      - name: Confirmar cambios generados
        run: |
          git config user.name "KateLopez05"
          git config user.email "146386020+KateLopez05@users.noreply.github.com"
          git add src/notebook/data src/notebook/reportes src/notebook/notebook_1.ipynb

          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi

          git commit -m "chore: actualizar resultados de Semana 1 [skip ci]"
          git push origin HEAD:main